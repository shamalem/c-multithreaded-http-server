name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind

      - name: Build
        run: make

      - name: Unit tests
        run: make test

      - name: Smoke test the live server
        run: |
          ./server &
          SERVER_PID=$!
          sleep 0.5
          curl -sf http://localhost:8080/ -o /dev/null
          curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/nope | grep -q 404
          kill -INT $SERVER_PID
          wait $SERVER_PID

      - name: Valgrind (no leaks, no errors)
        run: |
          valgrind --error-exitcode=1 --leak-check=full ./server &
          VG_PID=$!
          sleep 2
          curl -sf http://localhost:8080/ -o /dev/null
          kill -INT $VG_PID
          wait $VG_PID

      - name: AddressSanitizer build
        run: make asan
